changelog:
- date: Week 7 Day 33
  changes:
  - "Clusters 17, 20, 24, 32, 48: changed primitive from misinformation_generation\
    \ to instruction_override \u2014 these prompts use direct requests, not misinformation\
    \ framing as the attack technique. misinformation_generation is a behavior (what\
    \ the attacker wants), not a technique (how the prompt is structured)."
  - "Cluster 63: changed primitive from content_policy_circumvention to roleplay_jailbreak\
    \ \u2014 prompts use persona and role framing to bypass restrictions, not pure\
    \ policy bypass. The circular self-assignment (primitive == behavior) was a known\
    \ issue documented in known-issues.md Issue 7."
  - 'Result: primitives reduced from 8 to 6 unique values, removing content_policy_circumvention
    and misinformation_generation from the primitive dimension where they did not
    belong.'
